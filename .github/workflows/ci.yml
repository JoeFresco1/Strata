name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: strata
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d strata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATA_DB_BACKEND: postgres
      STRATA_DATABASE_URL: postgresql://strata:strata@127.0.0.1:5432/strata
      STRATA_POSTGRES_ADMIN_URL: postgresql://strata:strata@127.0.0.1:5432/postgres
      STRATA_EMBEDDINGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: python -m pytest tests/test_core.py -q
      - run: python -m compileall strata
      - run: python -m strata.migrations status
      - run: npm run test:cache
        working-directory: frontend
      - run: npm run test:layer0
        working-directory: frontend
      - run: npm run test:requests
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate prompt catalog and report source size
        shell: pwsh
        run: |
          Get-Content prompts.json -Raw | ConvertFrom-Json | Out-Null
          $files = Get-ChildItem strata,frontend/src,tests -Recurse -File |
            Where-Object { $_.Extension -in '.py','.js','.jsx','.css' }
          $oversized = $files | Where-Object { (Get-Content $_.FullName).Count -ge 1000 }
          if ($oversized) {
            Write-Output "Source-size report (informational; does not fail CI):"
            $oversized | ForEach-Object {
              $lineCount = (Get-Content $_.FullName).Count
              Write-Output "$($_.FullName): $lineCount lines"
              Write-Output "::warning file=$($_.FullName),title=Large source file::$lineCount lines"
            }
          }

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t strata:self-hosted .
