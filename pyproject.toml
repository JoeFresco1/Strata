[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-product-discovery"
version = "0.1.0.dev0"
description = "Local-first product discovery and feature architecture"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "beautifulsoup4==4.15.0",
  "fastapi==0.136.3",
  "pgvector==0.4.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "rapidfuzz==3.14.5",
  "requests==2.34.2",
  "sentence-transformers==5.5.1",
  "trafilatura==2.1.0",
  "uvicorn[standard]==0.49.0",
]

[project.scripts]
strata = "run_strata:main"
strata-migrate = "strata.migrations:main"

[tool.setuptools]
packages = ["strata"]
py-modules = ["run_strata", "serve_api"]
